[project]
name = "cuga-harness-kit"
version = "0.1.1"
description = "Scaffolds Claude Code / Cursor / Codex skills that teach coding agents to build with the cuga framework"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
cuga-harness-kit = "cuga_harness_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuga_harness_kit"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# The raw migration kit dirs are siblings of pyproject.toml, so the sdist's default file
# selection would otherwise sweep them in unfiltered (.git/, test fixtures and all). The build
# hook above force-includes an already-filtered copy under kits_staged/ instead — these excludes
# just stop the raw originals from *also* being swept in by default selection.
exclude = [
    "/cuga-migrator-claude",
    "/cuga-migrator-bob",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
